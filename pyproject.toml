[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gregtech-quest-translator"
version = "0.2.0"
description = "Translate Chinese quest and config files in Minecraft modpacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "googletrans==4.0.0-rc1",
    "tqdm",
    "nbtlib",
    "legacy-cgi>=2.6; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
gtqt-translate = "gregtech_quest_translator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gregtech_quest_translator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]